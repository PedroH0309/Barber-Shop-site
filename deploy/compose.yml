# Single-instance deployment with persistent SQLite storage; never scale the web service horizontally.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      COOKIE_SECURE: '1'
      REMINDERS_ENABLED: '0'
      AGENDA_DATA_DIR: /app/data
    volumes:
      - agenda-data:/app/data
    expose:
      - '8000'
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Configure DOMAIN in deploy/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  agenda-data:
  caddy-data:
  caddy-config:


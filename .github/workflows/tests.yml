name: Validate Precision Agenda

on:
  push:
    paths:
      - 'backend/**'
      - 'site/**'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'site/**'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend and booking regression tests
        run: |
          python test_system.py
          python test_schedule_sync.py
          python test_admin_v2.py
          python test_pwa.py
      - name: Browser script syntax
        run: |
          node --check site/admin.js
          node --check site/admin-pwa.js
          node --check site/booking.js
          node --check site/script.js

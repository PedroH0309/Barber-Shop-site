name: Import Precision Agenda source

on:
  push:
    paths:
      - 'source/precision-agenda-v2.1-base.zip'
      - '.github/workflows/import-precision-agenda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand site and backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('.').resolve()
          with ZipFile('source/precision-agenda-v2.1-base.zip') as archive:
              for member in archive.infolist():
                  if member.is_dir():
                      continue
                  destination = (root / member.filename).resolve()
                  if not destination.is_relative_to(root):
                      raise ValueError('Unsafe path in source ZIP')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(member))
          PY
          python -m compileall -q backend manage.py
          node --check site/admin.js
          node --check site/booking.js
      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "chore: unpack Precision Agenda into editable source files"
            git push origin HEAD:main
          fi
